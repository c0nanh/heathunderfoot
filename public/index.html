1.55911, -0.16218], [51.55904, -0.16205], [51.55897, -0.1619], [51.55894, -0.16173], [51.55892, -0.16156], [51.55887, -0.16139], [51.55882, -0.16122], [51.55875, -0.16109], [51.55866, -0.16098], [51.55855, -0.16092], [51.55845, -0.16086], [51.55837, -0.16075], [51.55828, -0.16065], [51.55818, -0.16057], [51.55808, -0.16046], [51.55798, -0.16039], [51.55787, -0.1603], [51.55778, -0.1602], [51.55769, -0.1601], [51.55759, -0.16001], [51.55749, -0.15992], [51.55737, -0.15984], [51.55727, -0.15974], [51.55717, -0.15964], [51.55708, -0.15955], [51.55698, -0.15946], [51.55688, -0.15937], [51.55678, -0.15928], [51.55668, -0.15919], [51.55657, -0.15908], [51.55648, -0.15898], [51.5564, -0.15885], [51.55635, -0.15869], [51.5563, -0.15855], [51.55618, -0.15853], [51.55607, -0.15853], [51.55596, -0.15851], [51.55584, -0.1585], [51.55573, -0.15848], [51.55563, -0.15841], [51.55559, -0.15825], [51.5556, -0.15807], [51.55562, -0.15788], [51.55566, -0.1577], [51.55568, -0.15752], [51.55569, -0.15732], [51.55571, -0.15715], [51.55575, -0.15698], [51.55576, -0.15679], [51.55575, -0.15661], [51.55577, -0.15643], [51.55579, -0.15624], [51.5558, -0.15606], [51.55578, -0.15587], [51.55575, -0.1557], [51.55567, -0.1556], [51.55555, -0.15552], [51.55545, -0.15546], [51.55534, -0.15539], [51.55524, -0.15531], [51.55513, -0.15524], [51.55503, -0.15517], [51.55492, -0.1551], [51.55481, -0.15501], [51.55471, -0.15493], [51.55462, -0.15484], [51.55452, -0.15477], [51.55441, -0.15472], [51.5543, -0.15466], [51.5542, -0.15458], [51.55409, -0.15452], [51.55398, -0.15447], [51.55388, -0.15437], [51.55378, -0.15429], [51.55367, -0.15422], [51.55357, -0.15413], [51.5536, -0.15395], [51.55365, -0.15379], [51.55371, -0.15363], [51.55376, -0.15346], [51.55382, -0.1533], [51.55388, -0.15314], [51.55387, -0.15297], [51.55381, -0.15282], [51.55371, -0.15274], [51.55362, -0.15262], [51.5536, -0.15245], [51.55362, -0.15228], [51.55352, -0.15219], [51.55349, -0.15205], [51.55351, -0.15187], [51.55357, -0.15171], [51.55365, -0.15202], [51.5536, -0.15186], [51.5535, -0.1518], [51.55355, -0.15185], [51.55363, -0.15171], [51.5537, -0.15155], [51.55373, -0.15147]];
STOPS=[{"n": 1, "title": "The tree that isn't there", "where": "Oak Village, between Lamble Street and Gordon House Road. The start.", "km": 0.0, "ele": 45, "html": "<p class=\"look\">Stand in Oak Village and look for an oak. There isn't one. That is rather the point.</p> <p class=\"story\">Every walk should begin at a memorial, and this one begins at a memorial to a tree. Gospel Oak is named for an oak that stood on the boundary between the parishes of Hampstead and St Pancras, near the corner of what is now Mansfield Road and Southampton Road. Once a year, at the beating of the bounds, the parish walked its own edge to fix it in living memory, since maps could not yet be trusted, and when the procession reached the tree it halted and a passage of the Gospel was read over it. The oak was last recorded on a map in 1801 and had gone by some point in the nineteenth century. The little grid of cottages you are standing in is named for it. So is the station, the district and a good deal of signage. None of it has an oak.</p> <p>Under your feet, the River Fleet. Its western branch rises on the Heath, comes down through the pond chain you will cross at stop 19, and runs culverted beneath Fleet Road and Southampton Road on its way to Blackfriars. It is the reason this valley was farmed rather than built on until the railways arrived.</p> <p>Three earls shaped these streets: Mansfield, Southampton and Lisburne. Remember the first. The Mansfields of Kenwood, whose house you reach at stop 7, owned the ground you are standing on; their surname is on Mansfield Road, and their house's approach road is Gordon House Road. Serious building started in the mid-1800s and accelerated after Gospel Oak station opened in 1860, under the name Kentish Town, which it kept until 1867. The railways were never good at names.</p> <div class=\"aside\"><strong>One street over</strong> Lissenden Gardens, the mansion-block estate on the far side of the railway, is where John Betjeman was born in 1906. He later wrote a poem called <em>Parliament Hill Fields</em> about the tram ride up Highgate Road.</div> <p class=\"last\">So: a landscape that was defended in Parliament seven times, and a district named after a tree that is not there. Through the gate.</p>", "img": [{"src": "s01-oak-village.jpg", "alt": "Terraced cottages in Oak Village, Gospel Oak", "caption": "Oak Village. No oak.", "credit": "Photo: Mrs628, CC BY-SA 3.0", "w": 1100, "h": 733}], "lat": 51.55388, "lon": -0.1514, "detour": false}, {"n": 2, "title": "Three hundred thousand pounds for a field", "where": "The Gordon House Road entrance, past the athletics track, climbing north-west.", "km": 0.6, "ele": 53, "html": "<p class=\"look\">Climb the eastern slope and look for a low block of stone set in the grass. It has heard more speeches than the House of Lords.</p> <p class=\"story\">You are walking across 270-odd acres that were very nearly a housing estate. When the Metropolitan Board of Works bought the original Heath in 1871 (that fight is told at stop 5), Parliament Hill Fields was not included. It was farmland and parkland belonging to the Mansfield estate and its neighbours, and everyone understood it would be built over. Everyone, it turned out, was wrong.</p> <p>A public campaign, fronted by Baroness Burdett-Coutts and Octavia Hill, raised the money instead. The Hampstead Heath Enlargement Act of 1886, amended in 1888, authorised the purchase; the Board adopted it in 1889, weeks before the Board itself was abolished and replaced by the London County Council. The price was \u00a3300,000, a startling sum, roughly six times what the whole of the original Heath had cost eighteen years earlier. It doubled the size of the open space at a stroke, and it is why you are walking across grass rather than through somebody's back garden.</p> <p>The low block is the <strong>Stone of Free Speech</strong>. Its origins are murky, but it seems to have been a rallying point for open-air religious and political meetings around two centuries ago, and it is the reason the eastern flank of the hill has a long tradition of soapbox oratory. On the ground above it, George Whitefield is said to have preached in 1739, to draw a crowd away from the horse races then run on the Heath. Which the crowd preferred is not recorded.</p> <p class=\"last\">Keep climbing. The summit was named by the people who lost.</p>", "img": [{"src": "s02-octavia-hill.jpg", "alt": "Portrait of Octavia Hill by John Singer Sargent", "caption": "Octavia Hill, who raised the money, painted by Sargent in 1898.", "credit": "John Singer Sargent, public domain", "w": 1100, "h": 1377}], "lat": 51.55787, "lon": -0.15189, "detour": false}, {"n": 3, "title": "Named by the losing side", "where": "The summit bench and the view indicator. Your watch logged 98.8 m here.", "km": 1.2, "ele": 98, "html": "<p class=\"look\">Stand at the view indicator and find the gap in the skyline in front of you. The gap is the law.</p> <p class=\"story\">Two stories compete for the name of this hill. Both are seventeenth-century, and the better one is the one that is not true.</p> <p>The famous one: that Robert Catesby, Guy Fawkes and their fellow conspirators came up here on 5 November 1605 to watch Parliament blow up. It is a lovely idea, and it is what gave the hill its older name of <strong>Traitors' Hill</strong>.</p> <p class=\"verdict\">Legend</p> <p>There is no contemporary evidence for it. The earliest printed versions are Victorian, and the conspirators had rather more pressing business that night.</p> <p>The sober one: during the Civil War, troops loyal to Parliament occupied and fortified the high ground north of London, and this hill was one of their observation points. To Royalists it was Traitors' Hill; to the other side it was Parliament Hill. The name that stuck belongs to the Parliamentarians, which is what tends to happen when you win.</p> <p>The view is legally defended. Parliament Hill holds one of London's protected strategic views, which is why the skyline has a conspicuous gap: developers cannot build into the sightline of St Paul's from this spot. The Palace of Westminster is visible too, which does no harm to the first story.</p> <div class=\"aside\"><strong>A footnote from the press</strong> In 1892 a boy digging on the hill is reported to have turned up coins and silver vessels valued at \u00a32,000, declared treasure trove and claimed by the Crown. He does not appear to have been asked to dig anywhere else.</div> <p class=\"last\">Now for a queen who is not here either. The mound is a couple of hundred metres north-east of the path you take off the summit.</p>", "img": [{"src": "s03-constable-london.jpg", "alt": "Constable's watercolour view over London from Hampstead Heath", "caption": "London from the Heath, by Constable. The gap was there before the law was.", "credit": "John Constable, public domain", "w": 968, "h": 632}], "lat": 51.55967, "lon": -0.15969, "detour": false}, {"n": 4, "title": "Boudica's grave, minus Boudica", "where": "A railed, tree-covered mound a couple of hundred metres north-east of the path off the summit. A short detour.", "km": 1.5, "ele": 95, "html": "<p class=\"look\">Look at the railings, the hawthorn and the mound. Then look for the sign saying whose grave it is. There isn't one, and the reason follows.</p> <p class=\"verdict\">Legend, tested and failed</p> <p class=\"story dc\">The Tumulus is a circular mound about 40 m across, ringed with iron railings and hawthorn, and for most of the nineteenth century the grave of a queen. Victorian antiquarians decided it was the burial place of Boudica after her defeat by Suetonius Paulinus in AD 60 or 61, and the idea took hold so firmly that the sculptor of the Westminster Bridge Boudica group proposed siting his statue on top of it.</p> <p>It was excavated in 1894. Nothing was found: no burial, no grave goods, nothing but domestic rubbish. The current best guesses are that it is either a genuine Bronze Age round barrow that was thoroughly robbed long ago, or, more prosaically, the raised mound of a seventeenth-century windmill. Neither has been proved. The statue went to Westminster Bridge.</p> <figure class=\"fig\"><img src=\"img/s04-boudica.jpg\" alt=\"The Boadicea and Her Daughters statue at Westminster Bridge\" width=\"1100\" height=\"955\" loading=\"lazy\" decoding=\"async\"><figcaption>Thornycroft's Boudica, which nearly stood on the mound and went to Westminster Bridge instead. <span>Photo: Paul Walter, CC BY 2.0</span></figcaption></figure> <p>The Heath does have real prehistory. Mesolithic flint tools have been found here, evidence of hunter-gatherers on this ridge around 7000 BC. Just not a queen.</p> <p class=\"last\">So: a barrow, or a windmill's footprint. Either way, no queen. Carry on towards the Viaduct, where a man with a much better claim to the land also lost.</p>", "img": [{"src": "s04-tumulus.jpg", "alt": "The railed, tree-covered mound known as the Tumulus", "caption": "The Tumulus, railed against queens.", "credit": "Photo: Richard Rogerson, CC BY-SA 2.0", "w": 1100, "h": 825}, {"src": "s04-boudica.jpg", "alt": "The Boadicea and Her Daughters statue at Westminster Bridge", "caption": "Thornycroft's Boudica, which nearly stood on the mound and went to Westminster Bridge instead.", "credit": "Photo: Paul Walter, CC BY 2.0", "w": 1100, "h": 955}], "lat": 51.5626, "lon": -0.161, "detour": true}, {"n": 5, "title": "The man who lost for forty-eight years", "where": "The high ground crossing north-west towards Kenwood. The Viaduct and its pond lie in the valley below and to your left.", "km": 2.2, "ele": 116, "html": "<p class=\"look\">Look down and to your left into the valley. There is a handsome brick bridge carrying a road from nowhere to nowhere. It is the most eloquent ruin on the Heath.</p> <p class=\"story\">Sir Thomas Maryon Wilson spent forty-eight years trying to build on the ground under your boots, and lost every single time. This is the fight on which the whole Heath was won, and it is worth knowing in detail because it is the most consequential thing that ever happened here.</p> <p>The manor of Hampstead is old. Ethelred the Unready granted land at \"Hemstede\" to Westminster Abbey in 986; it appears in Domesday; it passed into private hands in the twelfth century and, by 1767, into the Wilson family. In 1821 <strong>Sir Thomas Maryon Wilson</strong> inherited, and began.</p> <p>He was not a villain of the pantomime sort. He was a landowner with an entailed estate and a legally sound plan, and he brought private bills before Parliament in 1829, 1830, 1843, 1844, 1853, 1854 and 1856. Every one was defeated or withdrawn. The 1856 attempt was overtaken by a general Act on settled estates that contained a clause, unprecedented and clearly personal, expressly barring him from using it. Parliament had, in effect, passed a law with his name on it.</p> <p>Blocked in Parliament, he built anyway on land he held outright. From 1844 he threw a brick viaduct across the boggy valley below you, its foundation stone laid in 1845, as the spine of a carriage road serving 28 villas in the style of Regent's Park. He got a few courses of brick into the first villa. The excavations kept collapsing; the water kept coming in. The scheme died, and what survives is a handsome ornamental bridge over a handsome ornamental pond, carrying a road from nowhere to nowhere.</p> <p>Wilson died in 1869. His brother John, who inherited, had no appetite for the war. The Hampstead Heath Act 1871 let the Metropolitan Board of Works buy roughly 220 acres for \u00a345,000 plus \u00a32,000 in costs, on one statutory condition.</p> <blockquote class=\"pull\">Kept unenclosed and unbuilt on.<cite>Hampstead Heath Act, 1871</cite></blockquote> <p>For ever. Everything you walk over today descends from that sentence.</p> <div class=\"aside\"><strong>Why the Heath drains the way it does</strong> <div class=\"ill\" data-ill=\"geology\"><svg viewBox=\"0 0 320 175\" role=\"img\" aria-label=\"Rain sinks through the sand, meets the clay, and leaves sideways. Every pond, every sand pit and every flooded cellar on the Heath follows from that.\">\n<defs><pattern id=\"hatch\" width=\"7\" height=\"7\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"7\" stroke=\"currentColor\" stroke-width=\".7\" opacity=\".35\"/></pattern></defs>\n<path fill=\"url(#hatch)\" d=\"M0 116 L320 124 L320 170 L0 170 Z\"/>\n<path class=\"f\" d=\"M0 62 C60 42 100 42 140 52 C190 64 214 90 236 98 L0 92 Z\"/>\n<path class=\"s\" d=\"M0 92 L320 100\" stroke-dasharray=\"3 3\"/>\n<path class=\"s\" d=\"M0 116 L320 124\"/>\n<path class=\"s\" d=\"M0 62 C60 42 100 42 140 52 C190 64 220 122 262 127 C292 130 310 122 320 120\"/>\n<path class=\"t\" d=\"M78 22 L78 40 M72 34 L78 41 L84 34\" /><path class=\"t\" d=\"M118 22 L118 40 M112 34 L118 41 L124 34\"/><path class=\"t\" d=\"M158 26 L158 44 M152 38 L158 45 L164 38\"/>\n<path class=\"t\" stroke-dasharray=\"2.5 2.5\" d=\"M80 50 L84 88 L236 96 M120 50 L122 90 M160 56 L162 92\"/>\n<path class=\"t\" d=\"M236 96 L248 104 M243 105 L249 105 L248 99\"/>\n<ellipse class=\"w\" cx=\"266\" cy=\"126\" rx=\"26\" ry=\"5\"/>\n<rect class=\"w\" x=\"196\" y=\"74\" width=\"20\" height=\"18\"/>\n<path class=\"s\" d=\"M192 68 L196 68 L196 92 L216 92 L216 68 L220 68\"/>\n<path class=\"s\" d=\"M198 66 L214 66 L206 58 Z\"/>\n<text class=\"lb\" x=\"8\" y=\"84\">Bagshot Sands</text>\n<text class=\"lb\" x=\"8\" y=\"110\">Claygate Beds</text>\n<text class=\"lb\" x=\"8\" y=\"146\">London Clay</text>\n<text class=\"lb i\" x=\"66\" y=\"16\">rain</text>\n<text class=\"lb i\" x=\"234\" y=\"90\">spring</text>\n<text class=\"lb wt\" x=\"248\" y=\"144\">pond</text>\n<text class=\"lb i\" x=\"224\" y=\"66\">the villa</text>\n</svg><div class=\"cap\">Rain sinks through the sand, meets the clay, and leaves sideways. Every pond, every sand pit and every flooded cellar on the Heath follows from that.</div></div> <p>Underneath is London Clay, capped by Bagshot Sands and Claygate Beds. Water sinks through the sand, hits the clay and comes out sideways as springs, which is why there are ponds in every valley, why the sand was worth digging (stop 10), and why Wilson's villa foundations kept filling up. The geology was against him from the start. Nobody told him.</p></div> <p class=\"last\">On to Kenwood, past a bridge that is not a bridge either.</p>", "img": [{"src": "s05-viaduct.jpg", "alt": "The brick viaduct reflected in Viaduct Pond", "caption": "The Viaduct: a road from nowhere to nowhere.", "credit": "Photo: Tom Page, CC BY-SA 2.0", "w": 1100, "h": 733}], "lat": 51.56535, "lon": -0.16983, "detour": false}, {"n": 6, "title": "A bridge that is a painting", "where": "Below the house, by the water, before the final climb to the terrace.", "km": 2.8, "ele": 102, "html": "<p class=\"look\">Stand on the dam with the house behind you and look at the far end of the water. That bridge is a lie.</p> <p class=\"story\">The dip your watch recorded here is the dam of the <strong>Thousand Pound Pond</strong>. At its far end sits the <strong>Sham Bridge</strong>: a wooden screen, painted and shaped to read as a three-arched bridge from the house, with nothing behind it. It is pure eighteenth-century scene-painting, a picturesque incident placed to close the view from the terrace, and it has been fooling people from a distance for well over two hundred years.</p> <div class=\"ill\" data-ill=\"sham-bridge\"><svg viewBox=\"0 0 320 172\" role=\"img\" aria-label=\"Three arches from the terrace. One plank from the side.\">\n<text class=\"lb\" x=\"8\" y=\"14\">From the terrace</text>\n<path class=\"w\" d=\"M20 86 C50 82 70 92 100 88 C130 84 160 92 190 88 C220 84 250 92 300 88 L300 100 L20 100 Z\"/>\n<path class=\"f\" d=\"M44 36 L276 36 L276 82 L246 82 L246 62 A18 18 0 0 0 210 62 L210 82 L196 82 L196 62 A18 18 0 0 0 160 62 L160 82 L146 82 L146 62 A18 18 0 0 0 110 62 L110 82 L44 82 Z\"/>\n<path class=\"s\" d=\"M40 30 L280 30 M44 36 L276 36 L276 82 L246 82 L246 62 A18 18 0 0 0 210 62 L210 82 L196 82 L196 62 A18 18 0 0 0 160 62 L160 82 L146 82 L146 62 A18 18 0 0 0 110 62 L110 82 L44 82 Z\"/>\n<path class=\"s\" d=\"M52 30 L52 36 M64 30 L64 36 M76 30 L76 36 M88 30 L88 36 M100 30 L100 36 M112 30 L112 36 M124 30 L124 36 M136 30 L136 36 M148 30 L148 36 M160 30 L160 36 M172 30 L172 36 M184 30 L184 36 M196 30 L196 36 M208 30 L208 36 M220 30 L220 36 M232 30 L232 36 M244 30 L244 36 M256 30 L256 36 M268 30 L268 36\"/>\n<text class=\"lb\" x=\"8\" y=\"126\">From the side</text>\n<path class=\"w\" d=\"M20 160 C60 156 100 164 160 160 C220 156 260 164 300 160 L300 168 L20 168 Z\"/>\n<path class=\"t\" d=\"M160 128 L160 162\" stroke-width=\"3\"/>\n<path class=\"s\" d=\"M60 146 L130 146 M126 142 L131 146 L126 150\"/>\n<text class=\"lb\" x=\"30\" y=\"140\">the view from the house</text>\n<text class=\"lb i\" x=\"172\" y=\"140\">the bridge</text>\n</svg><div class=\"cap\">Three arches from the terrace. One plank from the side.</div></div> <p><strong>Humphry Repton</strong>, the last of the great English landscape improvers, came to Kenwood on 8 May 1793 at the invitation of the 2nd Earl of Mansfield, and produced one of his celebrated Red Books, the watercolour before-and-after volumes that were his sales technique, in a matter of weeks. He moved the approach drives, resited the kitchen garden and stables, laid out a flower garden west of the house, and planted along the southern boundary specifically to hide Kentish Town. He also wanted the Sham Bridge removed, calling it beneath the dignity of Kenwood. He was overruled. It is still there, and it is now one of the best-loved things on the estate, a lesson about experts that landowners have enjoyed ever since.</p> <p>The lawns hold two twentieth-century interventions worth finding: Barbara Hepworth's <em>Monolith (Empyrean)</em> of 1953 and Henry Moore's <em>Two Piece Reclining Figure No. 5</em> of 1964. Both are three-dimensional, which after the bridge feels like a courtesy.</p> <p class=\"last\">Now up the slope to the terrace. The house was saved by beer.</p>", "img": [{"src": "s06-sham-bridge.jpg", "alt": "The Sham Bridge seen across the Thousand Pound Pond", "caption": "The Sham Bridge across the Thousand Pound Pond, from roughly where the house wants you to stand.", "credit": "Photo: Peter S, CC BY-SA 2.0", "w": 1100, "h": 825}], "lat": 51.5693, "lon": -0.16917, "detour": false}, {"n": 7, "title": "Beer, a judge, and a Vermeer in a churchyard", "where": "The terrace and the Adam library. You stopped here for twenty minutes.", "km": 3.1, "ele": 112, "html": "<p class=\"look\">From the terrace, look back down the lawn to the water and the bridge you now know is a plank. Then turn round. The room at the east end is the library, and it is one of the finest rooms in England.</p> <p class=\"story\">A house called Caen Wood stood here from about 1616, built by John Bill, King's Printer to James I, and rebuilt around 1694 by William Bridges, Surveyor-General of the Ordnance. Everything that makes the building famous begins in 1754, when it was bought by <strong>William Murray, 1st Earl of Mansfield</strong>, Lord Chief Justice of England, who would go on to change the law of the land from a house with a fake bridge in the garden.</p> <p>From 1764 Murray employed <strong>Robert Adam</strong> to remodel it. Adam added the Ionic portico and, his masterstroke, the library on the east end, built to balance the existing orangery on the west and to hold Murray's books. It is one of the finest surviving Adam interiors anywhere, a barrel-vaulted room with apsidal ends screened by columns, designed, in Adam's own framing, as a room for both books and company.</p> <figure class=\"fig\"><img src=\"img/s07-library.jpg\" alt=\"The Adam library at Kenwood House\" width=\"1100\" height=\"825\" loading=\"lazy\" decoding=\"async\"><figcaption>Adam's library: a room for books and company. <span>Photo: Marathon, CC BY-SA 2.0</span></figcaption></figure> <h4>Mansfield, Somerset, and Dido Belle</h4> <p>In 1772 Mansfield decided <em>Somerset v Stewart</em>, the case of James Somerset, an enslaved man brought to England who escaped and was seized to be shipped to Jamaica. Mansfield ruled that slavery was:</p> <blockquote class=\"pull\">Of such a nature, that it is incapable of being introduced on any reasons, moral or political; but only positive law.<cite>Lord Mansfield, Somerset v Stewart, 1772</cite></blockquote> <p>That is, it could exist only where a statute expressly created it, and no English statute did. He afterwards insisted the judgment settled only the narrow question of forcible removal, but abolitionists read it as holding that slavery could not exist on English soil, and it became one of the load-bearing texts of the movement.</p> <p>Living in this house at the time was <strong>Dido Elizabeth Belle</strong> (1761\u20131804), the daughter of Mansfield's nephew Sir John Lindsay and Maria Belle, an enslaved African woman in the West Indies. Brought to England in 1765 and raised at Kenwood alongside her cousin Lady Elizabeth Murray, Dido lived here for some three decades in a position with no real precedent: she managed the dairy and poultry yards, and, far more unusually, took dictation for the Lord Chief Justice's correspondence, work normally done by a male secretary. A visitor in 1779, Thomas Hutchinson, noticed.</p> <blockquote class=\"pull\">She was called upon by my Lord every minute for this thing and that.<cite>Thomas Hutchinson, 1779</cite></blockquote> <p>The limits were real and should not be softened. She received \u00a320 a year against Lady Elizabeth's \u00a3100; she did not dine with formal company, joining the ladies afterwards for coffee; and Mansfield's will, which confirmed her freedom and left her \u00a3500 and an annuity of \u00a3100, pointedly declined to name her as his niece. Lady Elizabeth got \u00a310,000. A contemporary painting of the two young women together, long attributed to Zoffany and now generally given to David Martin (c. 1778), hangs in Scotland; Historic England calls it unique in eighteenth-century British art for showing a Black woman and a white woman as near equals. Dido married John Davinier in 1793 and died in Pimlico in 1804, aged 43.</p> <figure class=\"fig\"><img src=\"img/s07-dido-belle.jpg\" alt=\"Portrait of Dido Elizabeth Belle and Lady Elizabeth Murray\" width=\"1100\" height=\"938\" loading=\"lazy\" decoding=\"async\"><figcaption>Dido Belle and Lady Elizabeth Murray, c. 1778, now given to David Martin. <span>David Martin, public domain</span></figcaption></figure> <h4>Riot, bequest and theft</h4> <p>In June 1780 the anti-Catholic <strong>Gordon Riots</strong> engulfed London. Mansfield's Bloomsbury house was burned with his library in it, and a mob set out for Kenwood. The tradition, pub-owned but consistently told, is that the landlord of the Spaniards Inn (stop 8) stood the rioters free ale until cavalry arrived. The house survived. It was the first time beer saved Kenwood. It was not the last.</p> <p>The 2nd Earl added north wings by George Saunders; George III visited in 1794, William IV and Queen Adelaide in 1835. By the twentieth century the family had let the place out, to a Russian grand duke and then to an American heiress, and in 1922 the estate came onto the market for building. A Kenwood Preservation Council raised the money for 100 acres of the grounds, and 32 acres south of the mansion were opened to the public by George V in 1925.</p> <p>The house itself was saved by beer. <strong>Edward Cecil Guinness, 1st Earl of Iveagh</strong>, bought Kenwood with 74 acres in 1925, filled it with sixty-three Old Masters from his own collection, and left the whole thing to the nation on his death in 1927. It opened as a public gallery in 1928. What hangs here, Rembrandt's late <em>Self-Portrait with Two Circles</em>, Vermeer's <em>The Guitar Player</em>, Hals, Gainsborough, Reynolds, Romney, is among the best collections in Britain, and it is free.</p> <p>On the night of 23 February 1974 a thief cut the phone lines, smashed the shutters and a barred ground-floor window with a sledgehammer, took <em>The Guitar Player</em> and went over a ten-foot wall. The ransom note demanded that the IRA prisoners Dolours and Marion Price be transferred from an English prison to one in Ireland. Police long suspected Rose Dugdale, though she was never charged with it. The painting was recovered on 7 May 1974, propped against a gravestone in the churchyard of St Bartholomew the Great in Smithfield, wrapped in newspaper and tied with string. It was damp. It was otherwise fine.</p> <ul class=\"names\"> <li><b>c.1616</b><span>Caen Wood House built by John Bill, King's Printer</span></li> <li><b>1754</b><span>Bought by William Murray, 1st Earl of Mansfield</span></li> <li><b>1764</b><span>Robert Adam begins the remodelling; the library follows</span></li> <li><b>1772</b><span>Mansfield decides <em>Somerset v Stewart</em></span></li> <li><b>1780</b><span>Gordon Riots; Kenwood threatened, Bloomsbury house burned</span></li> <li><b>1793</b><span>Repton's Red Book; Mansfield dies; Dido Belle leaves and marries</span></li> <li><b>1925\u201328</b><span>Iveagh buys, dies, bequeaths; opens as a public gallery</span></li> <li><b>1974</b><span>Vermeer stolen in February, recovered in May</span></li> <li><b>1986</b><span>Passes to English Heritage on the abolition of the GLC</span></li> </ul> <p class=\"last\">Leave by the northern edge. The pub that saved the house is 350 m up the road, and it has a great deal to say for itself.</p>", "img": [{"src": "s07-kenwood.jpg", "alt": "The south front of Kenwood House", "caption": "Kenwood, south front. Library on the right, orangery on the left.", "credit": "Photo: Jim Osley, CC BY-SA 2.0", "w": 1100, "h": 630}, {"src": "s07-library.jpg", "alt": "The Adam library at Kenwood House", "caption": "Adam's library: a room for books and company.", "credit": "Photo: Marathon, CC BY-SA 2.0", "w": 1100, "h": 825}, {"src": "s07-dido-belle.jpg", "alt": "Portrait of Dido Elizabeth Belle and Lady Elizabeth Murray", "caption": "Dido Belle and Lady Elizabeth Murray, c. 1778, now given to David Martin.", "credit": "David Martin, public domain", "w": 1100, "h": 938}], "lat": 51.57155, "lon": -0.1679, "detour": false}, {"n": 8, "title": "A pub with a lot of names to drop", "where": "Along Kenwood's northern edge. The inn and its tollhouse pinch the road 350 m to your north-west.", "km": 3.8, "ele": 120, "html": "<p class=\"look\">Look up the road to where two buildings squeeze the traffic to a single lane. That pinch has been annoying drivers since about 1710, and the drivers have lost.</p> <p class=\"story\">The Spaniards Inn, on Hampstead Lane, claims 1585, and it stood at the entrance to the Bishop of London's estate. This was the boundary, and a boundary stone dated 1755 is still in the front garden. Opposite it, jutting into the carriageway, is the <strong>tollhouse of about 1710</strong>. The two buildings squeeze the road to one lane, which is why a 1966 proposal to demolish the tollhouse was thrown out: removing it would have made the traffic worse, not better. It is one of the few recorded cases of London traffic planning defending a building.</p> <p>The name most likely commemorates a Spanish ambassador who lodged there, though several rival explanations circulate, as they do wherever there is a bar.</p> <p class=\"verdict\">Legend</p> <p><strong>Dick Turpin.</strong> The pub says his father was landlord and that Turpin drank here. There is no documentary support for either claim. What is documented is that this stretch of road was genuinely dangerous, with arrests for highway robbery nearby recorded in 1751, so the association is at least the right kind of story in the right place.</p> <figure class=\"fig\"><img src=\"img/s08-spaniards-1914.jpg\" alt=\"The Spaniards Inn and tollhouse photographed in 1914\" width=\"1100\" height=\"800\" loading=\"lazy\" decoding=\"async\"><figcaption>The Spaniards in 1914, tollhouse on the left, already in the way. <span>public domain</span></figcaption></figure> <p>The literary tally is unusually long for one pub. Dickens put it in <em>The Pickwick Papers</em>, where Mrs Bardell is lured to the tea gardens. Bram Stoker used it in <em>Dracula</em>. Constable painted <em>Road to the Spaniards, Hampstead</em> in 1822. Galsworthy brought the Forsytes here. The pub's claim that Keats wrote <em>Ode to a Nightingale</em> in the garden is affectionate rather than accurate: he wrote it at Wentworth Place, a mile south-east, though you can see why the garden would like to think so.</p> <p class=\"last\">The pub also says it saved Kenwood from a mob with free beer in 1780. That one, for once, is probably true. Now up onto the ridge, and lunch.</p>", "img": [{"src": "s08-constable-spaniards.jpg", "alt": "Constable's painting Road to the Spaniards, Hampstead", "caption": "Constable, Road to the Spaniards, 1822.", "credit": "John Constable, public domain", "w": 1100, "h": 644}, {"src": "s08-spaniards-1914.jpg", "alt": "The Spaniards Inn and tollhouse photographed in 1914", "caption": "The Spaniards in 1914, tollhouse on the left, already in the way.", "credit": "public domain", "w": 1100, "h": 800}], "lat": 51.57158, "lon": -0.1729, "detour": false}, {"n": 9, "title": "A road standing on what was dug from under it", "where": "The ridge road. Your track paused here for nearly two hours, which is what happens when a walk has a pub on it.", "km": 4.0, "ele": 134, "html": "<p class=\"look\">Look at how the ground drops away on both sides of the road, behind the trees. The road was never raised. Everything else was lowered.</p> <p class=\"story\">You are on the spine of the Northern Heights, at 134 m the second-highest ground on the walk. The road runs along a natural sand ridge, and the reason it feels like a causeway, raised, with the heath falling away on either side behind avenues of trees, is that the land on both sides was quarried out from under it. The Heath's industry was sand, and the industry was thorough.</p> <p>In 1813 the fine sand was reckoned to average ten feet in depth. The lord of the manor sold it by the cartload, about twenty cartloads a day around 1811, and copyholders complained bitterly in 1806 that the pits were dangerous and had nearly destroyed the place. In 1866 and 1867 the Midland Railway bought quarter-acre strips along Spaniards Road and dug 25 feet down. In 1924 the road was closed to motor traffic on either side and the flanking tracks became bridle paths, which is why you can walk along it without being run over.</p> <figure class=\"fig\"><img src=\"img/s09-branch-hill.jpg\" alt=\"Constable's painting of Branch Hill Pond with sand diggings\" width=\"1100\" height=\"857\" loading=\"lazy\" decoding=\"async\"><figcaption>Constable's Branch Hill Pond, with the sand pits and their carts. <span>John Constable, public domain</span></figcaption></figure> <div class=\"aside\"><strong>Elms House</strong> Off the southern end of Spaniards Road stood Elms House, on the site of Mother Huff's tea garden, in business from 1678 to 1728. Thomas Erskine, later Lord Chancellor, lived there from 1811 to 1819; it became St Columba's Hospital in 1957, was later owned by the Woolworths heiress Barbara Hutton, and was converted to flats in 1987. Most things round here end as flats.</div> <p class=\"last\">Cross the road into the birches. What looks like ancient woodland is a hole.</p>", "img": [{"src": "s09-spaniards-road.jpg", "alt": "Spaniards Road running along the ridge between trees", "caption": "Spaniards Road: the ground on either side is the bit that is missing.", "credit": "Photo: David Howard, CC BY-SA 2.0", "w": 1100, "h": 825}, {"src": "s09-branch-hill.jpg", "alt": "Constable's painting of Branch Hill Pond with sand diggings", "caption": "Constable's Branch Hill Pond, with the sand pits and their carts.", "credit": "John Constable, public domain", "w": 1100, "h": 857}], "lat": 51.57005, "lon": -0.17411, "detour": false}, {"n": 10, "title": "The wood that is a hole", "where": "West of Spaniards Road, in the pits and hummocks under the birches.", "km": 4.5, "ele": 130, "html": "<p class=\"look\">Look at the hollows and banks under the birches. Every one of them was dug by somebody, and none of them was dug for fun.</p> <p class=\"story\">Sandy Heath, the triangle between Spaniards Road and North End Way, known when the Board bought it in 1871 as North Heath, looks like ancient wild wood. It is not. Almost every hollow, bank and pond here is a quarry, and the ground level is many feet below where it used to be. This is a post-industrial landscape that has had 150 years to grow a wood over itself, and it is now among the quietest parts of the Heath. In 2021 Quiet Parks International gave Hampstead Heath \"Urban Quiet Park\" status; this is the corner that earns it. Nobody is digging any more.</p> <p>Look for the <strong>Walter Field Memorial Fountain</strong>, put up in 1907 by the sister of the landscape painter Walter Field (b. 1837), who worked on the Heath. It is a listed structure and easy to walk past, which most people do.</p> <p>Beyond, to the north, lies the <strong>Heath Extension</strong>: 80 acres of Eton College's Wyldes farm, bought in 1907 after a campaign led by Henrietta Barnett, who then built Hampstead Garden Suburb up against it. She and her husband Samuel are commemorated with a blue plaque on Spaniards Road.</p> <p class=\"last\">Out of the trees to the top of North End Way. A Prime Minister is about to have a very bad year.</p>", "img": [{"src": "s10-sandy-heath.jpg", "alt": "Birch woodland over hummocky ground on Sandy Heath", "caption": "Sandy Heath. Every hollow is a quarry.", "credit": "Photo: Peter O'Connor aka anemoneprojectors, CC BY-SA 2.0", "w": 1100, "h": 825}], "lat": 51.56788, "lon": -0.17792, "detour": false}, {"n": 11, "title": "Meals through a hatch", "where": "The westernmost point of the walk, at the top of North End Way.", "km": 4.9, "ele": 114, "html": "<p class=\"look\">Look for an archway and a stretch of old wall in Pitt's Garden. That is all that is left of the house where the government of Britain hid from itself.</p> <p class=\"story\">A hamlet, then a resort, now barely a place at all. Three things happened here, and one of them was a Prime Minister refusing to open the door.</p> <p><strong>Pitt's seclusion.</strong> The merchant Charles Dingley invited <strong>William Pitt the Elder</strong> to North End in 1763 and rebuilt the house for him, with a new wing and a gymnasium for the children, by 1766, when Pitt moved in. Pitt was by then Earl of Chatham and, from 1766, effectively Prime Minister. In 1767 he collapsed into a severe depressive illness and withdrew here almost completely, refusing to see ministers and reportedly having his meals passed through a hatch. For a while the country was governed, in so far as it was governed at all, through a serving hatch in Hampstead. The house was known variously as North End House, Wildwoods and finally Pitt House, and was demolished in 1952. An archway and a stretch of wall survive, in what is now called Pitt's Garden.</p> <figure class=\"fig\"><img src=\"img/s11-pitt.jpg\" alt=\"Portrait of William Pitt the Elder\" width=\"1100\" height=\"1433\" loading=\"lazy\" decoding=\"async\"><figcaption>William Pitt the Elder, before the hatch. After William Hoare. <span>William Hoare, CC0</span></figcaption></figure> <p><strong>Wyldes Farm.</strong> Medieval land of the leper hospital of St James, bought by Eton College in 1449; the farmhouse dates from about 1600. The painter <strong>John Linnell</strong> moved his family here in the 1820s to escape London's air, and his visitors included <strong>William Blake</strong>. Linnell was Blake's patron in his last years, and it was Linnell who commissioned the Dante watercolours and the Job engravings. <strong>Charles Dickens</strong> stayed briefly in 1837, in the shattering weeks after the death of his sister-in-law Mary Hogarth. Raymond Unwin, co-planner of the Garden Suburb, lived there from 1906 to 1940. It survives as The Old Wyldes.</p> <p><strong>The Old Bull and Bush.</strong> A farmhouse by 1645, licensed to sell ale in 1721, with a music licence from 1867. Hogarth is said to have drunk here and to have had a hand in laying out the garden. It gave its name to the music-hall song made famous by Florrie Forde, which is why a pub on the edge of a heath is known to people who have never been to London, most of whom can sing the chorus.</p> <figure class=\"fig\"><img src=\"img/s11-bull-bush.jpg\" alt=\"The Old Bull and Bush public house\" width=\"1100\" height=\"792\" loading=\"lazy\" decoding=\"async\"><figcaption>The Old Bull and Bush. You know the song. <span>Photo: Jim Osley, CC BY-SA 2.0</span></figcaption></figure> <div class=\"aside\"><strong>The station that never opened</strong> Beneath you is North End station, \"Bull and Bush\", begun for the Charing Cross, Euston and Hampstead Railway and abandoned at platform level when Henrietta Barnett's campaign stopped development above it. It would have been the deepest station on the Underground. In the 1950s the shell was fitted out as a control centre for the deep-tube flood gates. An emergency stair of 197 steps comes up on Hampstead Way.</div> <p class=\"last\">Turn south into the woods. The next pond is a job-creation scheme.</p>", "img": [{"src": "s11-pitt-arch.jpg", "alt": "Brick archway surviving from Pitt House at North End", "caption": "The archway in Pitt's Garden, all that is left of the house.", "credit": "Photo: No Swan So Fine, CC BY-SA 4.0", "w": 1100, "h": 825}, {"src": "s11-pitt.jpg", "alt": "Portrait of William Pitt the Elder", "caption": "William Pitt the Elder, before the hatch. After William Hoare.", "credit": "William Hoare, CC0", "w": 1100, "h": 1433}, {"src": "s11-bull-bush.jpg", "alt": "The Old Bull and Bush public house", "caption": "The Old Bull and Bush. You know the song.", "credit": "Photo: Jim Osley, CC BY-SA 2.0", "w": 1100, "h": 792}], "lat": 51.5675, "lon": -0.18293, "detour": false}, {"n": 12, "title": "A pond as welfare policy", "where": "Turning south through the woods. The pond lies about 100 m to your west.", "km": 5.4, "ele": 122, "html": "<p class=\"look\">Look at the pond. It is shaped like a leg of mutton, which was the most imaginative thing anybody could think of to call it.</p> <p class=\"story\">The <strong>Leg of Mutton Pond</strong> was dug around 1816, almost certainly as a make-work scheme. The Napoleonic wars had ended in 1815; demobilised soldiers and a collapsed war economy produced serious unemployment, and parishes across England responded by inventing earthworks. This is one of them: a piece of Regency welfare policy that is now simply a nice pond, which is a better outcome than most welfare policy gets.</p> <p>West Heath, between North End Way and West Heath Road, came into public hands with the rest in 1871. It is the least visited third of the Heath and the most wooded, and if you have seen nobody for the last ten minutes, that is why.</p> <p class=\"last\">Climb. The high point of the walk is a garden built from the inside of a railway tunnel.</p>", "img": [{"src": "s12-leg-of-mutton.jpg", "alt": "Early twentieth-century postcard of the Leg of Mutton Pond", "caption": "The Leg of Mutton Pond on an Edwardian postcard, welfare policy at rest.", "credit": "public domain", "w": 1100, "h": 719}], "lat": 51.56455, "lon": -0.18231, "detour": false}, {"n": 13, "title": "The garden built from the inside of the Northern line", "where": "The high point of the walk. The pergola runs 250 m along the ridge above West Heath.", "km": 5.8, "ele": 136, "html": "<p class=\"look\">Look at the columns and the vaults, then look at what they are standing on. The ground is not the ground. It arrived by cart.</p> <p class=\"story\">This is the strangest thing on the Heath and the best argument for a February walk, when the wisteria is bare and the structure reads as pure architecture. The Hill Garden and its pergola were paid for by soap and built out of a tunnel.</p> <p><strong>William Hesketh Lever</strong>, of Lever Brothers and Sunlight Soap, later 1st Viscount Leverhulme, bought The Hill in 1904 and hired the landscape architect <strong>Thomas Mawson</strong>. The problem was the site: to look out over the Heath rather than at it, the garden needed to be 20 to 30 feet higher than it was. The solution arrived by cart. The Charing Cross, Euston and Hampstead Railway was at that moment driving its tunnels out to Golders Green, opened in 1907, and Lever bought the spoil. The terraces you walk on are, in substance, the inside of the Northern line.</p> <div class=\"ill\" data-ill=\"pergola\"><svg viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"The terrace you walk on is the inside of the Hampstead tunnel, carried up the hill a cartload at a time.\">\n<text class=\"lb\" x=\"8\" y=\"14\">1904</text>\n<path class=\"s\" d=\"M8 106 C40 102 80 110 140 104\"/>\n<path class=\"s\" d=\"M60 106 L60 84 L86 84 L86 106 M66 84 L73 76 L80 84\"/>\n<text class=\"lb\" x=\"40\" y=\"126\">the house, at ground level</text>\n<text class=\"lb\" x=\"176\" y=\"14\">1906 onwards</text>\n<path class=\"f\" d=\"M176 104 L176 58 L308 58 L308 100 C290 104 240 108 176 104 Z\"/>\n<path class=\"s\" d=\"M176 104 L176 58 L308 58 L308 100\"/>\n<path class=\"s\" d=\"M168 106 C200 102 250 110 312 104\"/>\n<path class=\"t\" d=\"M186 58 L186 34 M212 58 L212 34 M238 58 L238 34 M264 58 L264 34 M290 58 L290 34 M180 34 L296 34 M180 30 L296 30\"/>\n<path class=\"t\" d=\"M200 40 C204 46 200 50 206 54 M226 40 C230 46 226 50 232 54 M252 40 C256 46 252 50 258 54 M278 40 C282 46 278 50 284 54\" stroke-dasharray=\"1.5 2\"/>\n<text class=\"lb i\" x=\"196\" y=\"82\">tunnel spoil</text>\n<circle class=\"s\" cx=\"196\" cy=\"144\" r=\"11\"/>\n<path class=\"s\" d=\"M187 144 L205 144 M196 135 L196 153\" opacity=\".4\"/>\n<path class=\"t\" stroke-dasharray=\"2.5 2.5\" d=\"M204 134 L236 100 M229 101 L237 99 L236 107\"/>\n<text class=\"lb\" x=\"212\" y=\"148\">the Northern line</text>\n<text class=\"lb i\" x=\"228\" y=\"126\">spoil, by cart</text>\n</svg><div class=\"cap\">The terrace you walk on is the inside of the Hampstead tunnel, carried up the hill a cartload at a time.</div></div> <p>The first stage was finished in 1906 and Lever kept extending it for the rest of his life, buying adjoining land, adding a ballroom beneath the terrace in 1923, still building when he died in 1925. The result is a raised classical walk of columns, vaults and belvederes, laid out for a soap magnate's garden parties, with the wild heath immediately below it.</p> <figure class=\"fig\"><img src=\"img/s13-lever.jpg\" alt=\"Photograph of William Lever, 1st Viscount Leverhulme, in 1922\" width=\"1100\" height=\"1498\" loading=\"lazy\" decoding=\"async\"><figcaption>Lever in 1922, still building. <span>Bassano Ltd, public domain</span></figcaption></figure> <p>After Lever's death the house was bought by Andrew Weir, 1st Baron Inverforth, and renamed <strong>Inverforth House</strong>. He left it to Manor House Hospital in 1955; the London County Council took the gardens in 1960 and opened them to the public in 1963; the Corporation of London took over in the late 1980s and has been restoring the structure, which had been left to fall down, ever since. The house was sold to developers in the 1990s and is now flats. Of course it is.</p> <div class=\"aside\"><strong>The roof of inner London</strong> Your track's highest reading, 136.6 m, is on this ridge. The summit of the Heath just west of Spaniards Road, at 137 m, is the highest point in Inner London and was the highest point of the old County of London. It is not the highest point in Greater London. That is Westerham Heights in Bromley, at 245 m, and nobody has built a pergola on it.</div> <p class=\"last\">A short detour east now, to a pond for horses and the London end of a naval telegraph.</p>", "img": [{"src": "s13-pergola.jpg", "alt": "The Hill Garden Pergola with its columns and vaults", "caption": "The Pergola, standing on the Northern line.", "credit": "Photo: Jim Osley, CC BY-SA 2.0", "w": 1100, "h": 1091}, {"src": "s13-lever.jpg", "alt": "Photograph of William Lever, 1st Viscount Leverhulme, in 1922", "caption": "Lever in 1922, still building.", "credit": "Bassano Ltd, public domain", "w": 1100, "h": 1498}], "lat": 51.56187, "lon": -0.18055, "detour": false}, {"n": 14, "title": "Horses, semaphore and the most literary inn on the hill", "where": "A 250 m detour east from where you crossed North End Way.", "km": 6.1, "ele": 133, "html": "<p class=\"look\">Look at the pond, then at the milestone beside it, then at the little dome behind. Between them they cover horses, distance and the Navy.</p> <p class=\"story\">The pond at 133 m was the <strong>Horse Pond</strong>: a place to water horses at the top of a long hard climb, and to soak wooden cartwheels so the timber swelled and the iron tyres stayed on. The vestry enlarged and lined it in 1856. Its present name comes from the white milestone beside it.</p> <blockquote class=\"pull\">IV miles from St Giles, 4\u00bd miles 29 yards from Holborn Bars.<cite>The white stone, Whitestone Pond</cite></blockquote> <p>Height made this ridge useful. Between 1808 and 1814 the Heath carried a station in the Admiralty's <strong>shutter telegraph</strong> chain, the semaphore relay that ran from Whitehall to Great Yarmouth, passing messages by line of sight in minutes rather than a day's ride. The little domed <strong>Hampstead Observatory</strong>, run by the Hampstead Scientific Society, still uses the same asset and is open to the public on clear winter evenings.</p> <div class=\"ill\" data-ill=\"telegraph\"><svg viewBox=\"0 0 320 130\" role=\"img\" aria-label=\"Open and shut the six shutters in patterns and the next hill reads the letter. Whitestone Pond was the London end of the coast.\">\n<path class=\"s\" d=\"M52 122 L52 96 M30 96 L74 96 M30 26 L74 26 M30 26 L30 96 M74 26 L74 96 M52 26 L52 96\"/>\n<rect class=\"f\" x=\"34\" y=\"30\" width=\"15\" height=\"18\"/><rect class=\"s\" x=\"34\" y=\"30\" width=\"15\" height=\"18\"/>\n<path class=\"s\" d=\"M55 30 L70 30 L70 48 L55 48 Z\" fill=\"none\"/>\n<path class=\"s\" d=\"M34 52 L49 52 L49 70 L34 70 Z\" fill=\"none\"/>\n<rect class=\"f\" x=\"55\" y=\"52\" width=\"15\" height=\"18\"/><rect class=\"s\" x=\"55\" y=\"52\" width=\"15\" height=\"18\"/>\n<rect class=\"f\" x=\"34\" y=\"74\" width=\"15\" height=\"18\"/><rect class=\"s\" x=\"34\" y=\"74\" width=\"15\" height=\"18\"/>\n<rect class=\"f\" x=\"55\" y=\"74\" width=\"15\" height=\"18\"/><rect class=\"s\" x=\"55\" y=\"74\" width=\"15\" height=\"18\"/>\n<text class=\"lb\" x=\"10\" y=\"14\">six shutters</text>\n<path class=\"s\" d=\"M100 70 L314 70\" opacity=\".4\"/>\n<path class=\"t\" stroke-dasharray=\"2 3\" d=\"M100 66 C122 40 148 40 170 66 M170 66 C188 44 204 44 222 66 M222 66 C238 46 252 46 268 66 M268 66 C284 46 298 46 314 66\"/>\n<circle class=\"s\" cx=\"100\" cy=\"70\" r=\"4\" fill=\"none\"/>\n<circle class=\"f\" cx=\"170\" cy=\"70\" r=\"6\"/><circle class=\"t\" cx=\"170\" cy=\"70\" r=\"6\"/>\n<circle class=\"s\" cx=\"222\" cy=\"70\" r=\"4\" fill=\"none\"/><circle class=\"s\" cx=\"268\" cy=\"70\" r=\"4\" fill=\"none\"/><circle class=\"s\" cx=\"314\" cy=\"70\" r=\"4\" fill=\"none\"/>\n<text class=\"lb\" x=\"100\" y=\"90\" text-anchor=\"middle\">Admiralty</text>\n<text class=\"lb i\" x=\"170\" y=\"90\" text-anchor=\"middle\">Hampstead</text>\n<text class=\"lb\" x=\"316\" y=\"90\" text-anchor=\"end\">Gt Yarmouth</text>\n<text class=\"lb\" x=\"205\" y=\"110\" text-anchor=\"middle\">hilltop to hilltop, by line of sight, in minutes</text>\n</svg><div class=\"cap\">Open and shut the six shutters in patterns and the next hill reads the letter. Whitestone Pond was the London end of the coast.</div></div> <p><strong>Jack Straw's Castle</strong>, on the corner, is named for the leader, with Wat Tyler and John Ball, of the Peasants' Revolt of 1381. The tradition is that he sheltered here before being taken and beheaded.</p> <p class=\"verdict\">Legend</p> <p>There is no evidence of a building on this site in 1381, and no record of a pub here before the early 1700s. But it was a proper coaching inn once the road mattered. Dickens came repeatedly, and knew what he was coming for.</p> <blockquote class=\"pull\">A red-hot chop for dinner, and a glass of good wine.<cite>Charles Dickens, on Jack Straw's Castle</cite></blockquote> <p>Thackeray and Wilkie Collins drank here; Stoker set a scene here in <em>Dracula</em>; Pinter used it in <em>No Man's Land</em>. It was wrecked by a bomb, reported in the <em>Daily Herald</em> on 29 March 1941, and rebuilt in 1964 to a weatherboarded design by <strong>Raymond Erith</strong>, the classicist who also rebuilt the interior of 10 Downing Street. Betjeman called it \"true Middlesex\" and \"a delight\". It stopped being a pub in 2002 and is now flats and a gym, which is a sad end for the most literary inn on the hill.</p> <figure class=\"fig\"><img src=\"img/s14-jack-straws.jpg\" alt=\"The weatherboarded front of Jack Straw's Castle\" width=\"1100\" height=\"732\" loading=\"lazy\" decoding=\"async\"><figcaption>Jack Straw's Castle, Raymond Erith's weatherboarded rebuild of 1964. True Middlesex. <span>Photo: George Rex, CC BY-SA 2.0</span></figcaption></figure> <p class=\"last\">Back west along the avenue of limes. The judges are not coming.</p>", "img": [{"src": "s14-whitestone.jpg", "alt": "Whitestone Pond on the summit ridge", "caption": "Whitestone Pond, the former Horse Pond.", "credit": "Photo: Karlunun, CC BY-SA 4.0", "w": 1100, "h": 452}, {"src": "s14-jack-straws.jpg", "alt": "The weatherboarded front of Jack Straw's Castle", "caption": "Jack Straw's Castle, Raymond Erith's weatherboarded rebuild of 1964. True Middlesex.", "credit": "Photo: George Rex, CC BY-SA 2.0", "w": 1100, "h": 732}], "lat": 51.5606, "lon": -0.1783, "detour": true}, {"n": 15, "title": "The judges who never sat here", "where": "The avenue along the top, before the drop into Hampstead Grove.", "km": 6.2, "ele": 130, "html": "<p class=\"look\">Look up. Constable did, repeatedly, from this ridge, and wrote the weather on the back.</p> <p class=\"story\">Judges Walk is an avenue of limes appearing on London maps from 1745, running along the top above Upper Terrace. The name is attached to a story that during the Great Plague of 1665 the courts fled the City and sat in the open air up here, out of the infected air, dispensing justice in the breeze.</p> <p class=\"verdict\">Legend, and probably late</p> <p>No contemporary record supports it, and the walk was more plausibly named for judges who lived nearby or promenaded there. It is nonetheless the sort of story that Hampstead has always liked about itself: the hill as the healthy place, the refuge above the smoke. That belief is the engine of the next stop but one.</p> <p>This is Constable country in a literal sense. <strong>John Constable</strong> took 2 Lower Terrace, just off here, in 1821, and painted this ground repeatedly: the pond at Branch Hill, the sand excavations, the firs, and above all the sky. He did his oil sketches of cloud formations on this ridge, annotating them on the back with the date, hour, wind direction and weather. It is the closest thing English painting has to a meteorological record, and considerably better to look at than one.</p> <p class=\"last\">Down the hill into Hampstead Grove, where a captain built a ship on his roof.</p>", "img": [{"src": "s15-cloud-study.jpg", "alt": "Constable's oil sketch of clouds, 1822", "caption": "Constable, Cloud Study, 1822. Weather, dated and timed on the back.", "credit": "John Constable, public domain", "w": 1100, "h": 911}], "lat": 51.55933, "lon": -0.17942, "detour": false}, {"n": 16, "title": "A quarterdeck on the roof", "where": "Between Admiral's House and Fenton House. You stopped here for half an hour.", "km": 6.4, "ele": 123, "html": "<p class=\"look\">Look at the roof of the white house. Those are bulwarks and portholes. There has never been an admiral in it.</p> <p class=\"story\">The street was simply \"The Grove\" when first recorded in 1831; it was renamed Hampstead Grove in 1937 to stop it being confused with The Grove in Highgate, which tells you something about the two villages' opinion of each other.</p> <p><strong>Admiral's House</strong> was built in 1700 by Charles Keys and originally called Golden Spikes, possibly because it served as a masonic lodge between 1730 and 1745. The naval captain <strong>Fountain North</strong> bought it around 1775, renamed it The Grove, and added the thing you cannot miss: a quarterdeck on the roof, with bulwarks and portholes. No admiral ever lived here. The name is an eighteenth-century error, apparently caused by confusion with Admiral Matthew Barton, another Hampstead resident who fired cannon from his own roof. Hampstead had, at that point, more than one man doing this.</p> <p>Constable painted it. <strong>George Gilbert Scott</strong>, of St Pancras station, the Albert Memorial and some 800 other buildings, lived here from 1856 to 1865 and decided Hampstead was too cold for him; his blue plaque went up in 1910. And it is the model for Admiral Boom's house in <em>Mary Poppins</em>: P. L. Travers lived in Hampstead, and the cannon-firing admiral came straight off this roof. The 1964 film shot here. In the adjoining Grove House, John Galsworthy wrote most of <em>The Forsyte Saga</em> between 1918 and 1933.</p> <figure class=\"fig\"><img src=\"img/s16-admirals-house.jpg\" alt=\"Admiral's House with its rooftop quarterdeck\" width=\"1100\" height=\"1140\" loading=\"lazy\" decoding=\"async\"><figcaption>Admiral's House today. Still no admiral. <span>Photo: Jim Osley, CC BY-SA 2.0</span></figcaption></figure> <p>A few doors down is <strong>Fenton House</strong>, built in 1693 and the oldest surviving mansion in Hampstead: a plain, beautiful merchant's house of warm brick with a walled garden, sunken garden and an orchard of about thirty apple varieties. It was called Ostend House, then Clock House; the present name comes from <strong>Philip Fenton</strong>, a Riga merchant who bought it in 1793. Its last owner, Lady Binning, left it to the National Trust in 1952 along with her porcelain. It also holds the Benton Fletcher collection of early keyboard instruments, harpsichords, virginals, spinets and clavichords, which are kept in playing order and are played. If you hear a harpsichord through an open window, that is what it is. Grade I listed.</p> <figure class=\"fig\"><img src=\"img/s16-fenton-house.jpg\" alt=\"Fenton House and its front garden\" width=\"1100\" height=\"825\" loading=\"lazy\" decoding=\"async\"><figcaption>Fenton House, 1693, the oldest mansion in Hampstead. <span>Photo: Len Williams, CC BY-SA 2.0</span></figcaption></figure> <p>Also on this street: New Grove House, home of the artist and novelist <strong>George du Maurier</strong>, who wrote <em>Trilby</em> and gave the language the word \"Svengali\"; his son Gerald the actor, and thus his granddaughter Daphne, belong to the same house.</p> <p class=\"last\">Down Holly Hill and Heath Street, across the top of the village. The whole place exists because the water tasted of rust.</p>", "img": [{"src": "s16-constable-admirals.jpg", "alt": "Constable's painting of the Admiral's House, Hampstead", "caption": "Constable's Admiral's House, quarterdeck and all.", "credit": "John Constable, public domain", "w": 1100, "h": 961}, {"src": "s16-admirals-house.jpg", "alt": "Admiral's House with its rooftop quarterdeck", "caption": "Admiral's House today. Still no admiral.", "credit": "Photo: Jim Osley, CC BY-SA 2.0", "w": 1100, "h": 1140}, {"src": "s16-fenton-house.jpg", "alt": "Fenton House and its front garden", "caption": "Fenton House, 1693, the oldest mansion in Hampstead.", "credit": "Photo: Len Williams, CC BY-SA 2.0", "w": 1100, "h": 825}], "lat": 51.55782, "lon": -0.17932, "detour": false}, {"n": 17, "title": "Rust, bottled", "where": "Down Holly Hill and Heath Street, across the top of the village, then east along Well Walk to the Heath.", "km": 6.9, "ele": 103, "html": "<p class=\"look\">Look at the 1882 fountain on Well Walk. It marks a well that never ran properly and a spa that lasted about twenty-four years. The village it made is still here.</p> <p class=\"story\">Hampstead is a hilltop village that became fashionable because of iron in the water, and these three streets are the whole story.</p> <p>The springs here are <strong>chalybeate</strong>: iron-bearing, faintly rusty, and in the seventeenth century believed to be medicinal. Celia Fiennes compared them to Tunbridge Wells and Bath in 1697. On 20 December 1698 the Earl and Countess of Gainsborough conveyed six acres of spring-bearing land to trustees for the benefit of Hampstead's poor, and the trustees promptly went into business. By 1700 the water was being advertised for sale at Charing Cross and Cheapside, which is a considerable achievement for water that tasted of nails.</p> <p>In 1701 John Duffield leased the land at \u00a350 a year and built the apparatus of a spa: a Great Room for assemblies, partitioned to hold a pump room with a basin of the water; a tavern, a chapel, shops, formal gardens and a bowling green. Concerts and dances started in the summer of 1701. Dr John Arbuthnot took the waters in the Long Room in 1734, and Alexander Pope came to see him. The nearby Upper Flask tavern became a summer haunt of the Kit-Cat Club until it broke up around 1720.</p> <p>It did not last. Scandal, unpaid rents and slack trustees killed the trade; in 1725 the Great Room was converted into a chapel, and the spa was effectively finished. The village it had drawn to the hilltop stayed, and has been charging for the view ever since.</p> <ul class=\"names plain\"> <li><b>Flask Walk</b><span>Named for the flasks the mineral water was bottled in, at the site of the present Flask pub, and sold across London under a seal of a wolf rampant with seven crosslets.</span></li> <li><b>Well Walk</b><span>The spa's promenade. The 1882 memorial fountain marks the well; the original source, about 100 yards uphill, was filled in around 1880 and the new one never ran properly once the sewers went in.</span></li> <li><b>Burgh House</b><span>Built 1704. The spa's physician Dr William Gibbons moved in and enlarged it in 1720; his initials are in the wrought-iron gate. Rudyard Kipling's daughter lived here from 1933 to 1937, and his last outing, in 1936, was to visit her. Now Hampstead Museum. Grade I.</span></li> </ul> <figure class=\"fig\"><img src=\"img/s17-burgh-house.jpg\" alt=\"Burgh House, a Queen Anne brick house\" width=\"1100\" height=\"825\" loading=\"lazy\" decoding=\"async\"><figcaption>Burgh House, 1704, enlarged by the spa's physician. <span>Photo: Matt Brown from London, England, CC BY 2.0</span></figcaption></figure> <p><strong>John Constable</strong> lived at 40 Well Walk (renumbered from 6) from the summer of 1827 until his death in 1837, and painted London from its windows. His grave is in the churchyard of St John-at-Hampstead on Church Row, five minutes west. In 1774 Roman pottery was dug up in this street, which has led to a long-running and unresolved argument about whether a Roman road ran over the hill. It is still running. So, probably, is the argument.</p> <figure class=\"fig\"><img src=\"img/s17-well-walk-fountain.jpg\" alt=\"The chalybeate memorial fountain on Well Walk\" width=\"1100\" height=\"734\" loading=\"lazy\" decoding=\"async\"><figcaption>The 1882 fountain on Well Walk, marking a well that never ran properly. <span>Photo: N Chadwick, CC BY-SA 2.0</span></figcaption></figure> <p class=\"last\">East along Well Walk onto the East Heath. Ahead is a pen for pigs, and the most successful piece of estate agency in London.</p>", "img": [{"src": "s17-flask-walk.jpg", "alt": "Flask Walk with its shops and the Flask pub", "caption": "Flask Walk, where the rust was bottled.", "credit": "Photo: David, CC BY 2.0", "w": 1100, "h": 733}, {"src": "s17-burgh-house.jpg", "alt": "Burgh House, a Queen Anne brick house", "caption": "Burgh House, 1704, enlarged by the spa's physician.", "credit": "Photo: Matt Brown from London, England, CC BY 2.0", "w": 1100, "h": 825}, {"src": "s17-well-walk-fountain.jpg", "alt": "The chalybeate memorial fountain on Well Walk", "caption": "The 1882 fountain on Well Walk, marking a well that never ran properly.", "credit": "Photo: N Chadwick, CC BY-SA 2.0", "w": 1100, "h": 734}], "lat": 51.55729, "lon": -0.17658, "detour": false}, {"n": 18, "title": "An estate agent's euphemism", "where": "Out across the East Heath. The Vale lies in its hollow 400 m to your north-west.", "km": 7.4, "ele": 101, "html": "<p class=\"look\">Look for a small walled enclosure standing on its own in the grass. It is for pigs.</p> <p class=\"story\">This open ground was the East Park, the 60 acres Maryon Wilson held freehold and fought hardest to build on, and where the Viaduct scheme was aimed. On it stands <strong>the Pound</strong>, built in 1787 to impound stray pigs, with a keeper, John Stevenson, to run it. It is the most ordinary structure on the Heath and the one that most directly records what a common was actually for.</p> <p>In the hollow to the north-west is the <strong>Vale of Health</strong>, a hamlet entirely surrounded by heath. It was a boggy patch called Gangmoor, and then, after a harness-maker named Samuel Hatch put up a workshop around 1714, Hatch's or Hatchett's Bottom. In 1777 the Hampstead Water Company enlarged the pond and drained the marsh; cottages for the poor followed in 1779. The name \"Vale of Health\" first appears in 1801 and is, by all appearances, an estate agent's euphemism that worked. Somebody looked at Hatchett's Bottom and saw a brochure.</p> <p>What followed was one of the densest literary clusters in London. <strong>Leigh Hunt</strong> lived here from 1815 to 1819, straight out of prison for libelling the Prince Regent, and his cottage became the meeting place for the second generation of Romantics: Byron and Shelley both came, and Keats, who lived at Wentworth Place, now Keats House on Keats Grove, a mile south-east, was Hunt's prot\u00e9g\u00e9. Coleridge and George Crabbe were in the Vale between 1825 and 1832. Later came Rabindranath Tagore (1912), D. H. Lawrence (1915), Stella Gibbons (1927\u201330, working on <em>Cold Comfort Farm</em>), and Compton Mackenzie (1937\u201343), who had the measure of it.</p> <blockquote class=\"pull\">Village life half an hour from Piccadilly Circus.<cite>Compton Mackenzie, on the Vale of Health</cite></blockquote> <figure class=\"fig\"><img src=\"img/s18-leigh-hunt.jpg\" alt=\"Portrait of Leigh Hunt, circa 1810\" width=\"1100\" height=\"1388\" loading=\"lazy\" decoding=\"async\"><figcaption>Leigh Hunt, c. 1810, a few years before prison and the Vale. <span>Unidentified painter, public domain</span></figcaption></figure> <div class=\"aside\"><strong>'Appy 'Ampstead</strong> From the 1860s the Vale had a hotel, tea gardens and a fairground, and the East Heath held bank-holiday fairs on a scale now hard to imagine: 30,000 people on an August Monday in the 1870s, 50,000 on a fine Whit Monday, an estimated 200,000 on Easter Monday 1910. Hampstead Heath station opened in 1860 and brought the East End up by the trainload. In 1892 nine people died in a crush escaping a thunderstorm.</div> <p class=\"last\">Down into the dip. Everything you are about to walk across is a dam.</p>", "img": [{"src": "s18-east-heath-mcintyre.jpg", "alt": "Painting of the East Heath with the Vale of Health pond, 1890", "caption": "The East Heath and the Vale of Health pond in 1890, by Robert Finlay McIntyre.", "credit": "Robert Finlay McIntyre, public domain", "w": 1100, "h": 653}, {"src": "s18-leigh-hunt.jpg", "alt": "Portrait of Leigh Hunt, circa 1810", "caption": "Leigh Hunt, c. 1810, a few years before prison and the Vale.", "credit": "Unidentified painter, public domain", "w": 1100, "h": 1388}], "lat": 51.56038, "lon": -0.17198, "detour": false}, {"n": 19, "title": "The paths are dams", "where": "The dip in your profile, crossing the dams of the Hampstead chain.", "km": 7.9, "ele": 77, "html": "<p class=\"look\">Stand on the path between two ponds and notice that the water on one side is higher than the water on the other. You are standing on the wall.</p> <p class=\"story\">The Hampstead Ponds are not natural lakes. They are reservoirs, built in a chain down the valley of the Fleet's western branch, and the dams are the paths you walk on. London drank this.</p> <div class=\"ill\" data-ill=\"pond-chain\"><svg viewBox=\"0 0 320 150\" role=\"img\" aria-label=\"Four reservoirs stepped down the valley of the Fleet. What you walk across between them is not a path with a pond either side. It is the dam.\">\n<path class=\"s\" d=\"M6 30 L56 30 L64 62 L114 62 L122 94 L172 94 L180 126 L230 126 L238 140 L310 140\" opacity=\".35\"/>\n<path class=\"w\" d=\"M8 30 C18 24 46 24 56 30 L56 34 L8 34 Z\"/>\n<path class=\"w\" d=\"M66 62 C76 56 104 56 114 62 L114 66 L66 66 Z\"/>\n<path class=\"w\" d=\"M124 94 C134 88 162 88 172 94 L172 98 L124 98 Z\"/>\n<path class=\"w\" d=\"M182 126 C192 120 220 120 230 126 L230 130 L182 130 Z\"/>\n<path class=\"f\" d=\"M56 26 L64 26 L64 62 L56 62 Z M114 58 L122 58 L122 94 L114 94 Z M172 90 L180 90 L180 126 L172 126 Z M230 122 L238 122 L238 140 L230 140 Z\"/>\n<path class=\"t\" d=\"M56 26 L64 26 M114 58 L122 58 M172 90 L180 90 M230 122 L238 122\" stroke-width=\"2.5\"/>\n<path class=\"t\" stroke-dasharray=\"1.5 2\" d=\"M54 22 L66 22 M112 54 L124 54 M170 86 L182 86 M228 118 L240 118\"/>\n<text class=\"lb wt\" x=\"8\" y=\"46\">Vale of Health</text>\n<text class=\"lb wt\" x=\"66\" y=\"78\">Mixed Bathing</text>\n<text class=\"lb wt\" x=\"124\" y=\"110\">No. 2</text>\n<text class=\"lb wt\" x=\"182\" y=\"142\">No. 1</text>\n<text class=\"lb i\" x=\"72\" y=\"20\">the path is the dam</text>\n<path class=\"s\" d=\"M246 140 L310 140 M304 136 L310 140 L304 144\"/>\n<text class=\"lb\" x=\"248\" y=\"134\">to the Fleet</text>\n</svg><div class=\"cap\">Four reservoirs stepped down the valley of the Fleet. What you walk across between them is not a path with a pond either side. It is the dam.</div></div> <p>The springs here were earmarked for London's supply as early as 1543. In 1692 Parliament created the <strong>Hampstead Water Company</strong> to exploit them, and it dammed Hampstead Brook in stages through the eighteenth century, two ponds by 1703, three by 1745, four by 1810, building what are now the Mixed Bathing Pond, Hampstead No. 2 and Hampstead No. 1. A steam pumping engine worked below No. 1 from the 1830s until 1907. In 1856 the New River Company bought the Vale of Health Pond, the Viaduct Pond and Hampstead No. 1 for drinking water, at a time when contemporaries were describing the Vale of Health pond as weed-choked and receiving sewage. Drinking use ended before 1900, which on that evidence was late. There are eighteen ponds on the Heath today.</p> <p>Swimming came in sideways: informal immersion in the early 1800s, formalised at the Mixed Pond by 1884. The <strong>Highgate Men's Pond</strong>, on the other chain, opened on 1 May 1893. The <strong>Kenwood Ladies' Pond</strong> opened in June 1926 and is still the only women-only open-water bathing pond in Europe; it marked its centenary in 2026. In 2005 the High Court settled a long fight with the Corporation by ruling that adults could swim unsupervised at their own risk, which is why the ponds are open all year without lifeguards on the water at dawn, to the continuing bafflement of visitors.</p> <figure class=\"fig\"><img src=\"img/s19-mixed-pond.jpg\" alt=\"The Mixed Bathing Pond with its jetty\" width=\"1100\" height=\"825\" loading=\"lazy\" decoding=\"async\"><figcaption>The Mixed Bathing Pond. The path in front of you is the dam. <span>Photo: Fry72, CC BY-SA 4.0</span></figcaption></figure> <p>The dams are also, unglamorously, statutory reservoirs above a densely populated valley. The Corporation rebuilt them for safety between 2014 and 2016, to considerable local fury and a generally good result.</p> <p class=\"last\">Past the Lido, and back to the oak.</p>", "img": [{"src": "s19-bathing-pond-mcintyre.jpg", "alt": "Victorian painting of the bathing pond on Hampstead Heath", "caption": "The bathing pond, painted by Robert Finlay McIntyre in the 1890s.", "credit": "Robert Finlay McIntyre, public domain", "w": 1100, "h": 740}, {"src": "s19-mixed-pond.jpg", "alt": "The Mixed Bathing Pond with its jetty", "caption": "The Mixed Bathing Pond. The path in front of you is the dam.", "credit": "Photo: Fry72, CC BY-SA 4.0", "w": 1100, "h": 825}], "lat": 51.55974, "lon": -0.16544, "detour": false}, {"n": 20, "title": "Back to the tree that isn't there", "where": "Past the Lido and the athletics track, out of the Fields, and east into Oak Village.", "km": 8.7, "ele": 55, "html": "<p class=\"look\">Look at the Lido. It is unheated. The people in it regard that as the point.</p> <p class=\"story\"><strong>Parliament Hill Lido</strong> opened on 20 August 1938, designed by Harry Rowbotham and T. L. Smithson of the London County Council Parks Department. At \u00a334,000 it was the most expensive of the thirteen lidos the LCC built between 1920 and 1939, an unmistakable piece of municipal ambition dropped at the working-class end of the park, where the fairground crowds came off the trains. It was listed Grade II in January 1999 and given a stainless steel lining in 2005, the first outdoor pool in Britain to get one. It is unheated, which regular swimmers regard as the point.</p> <p>Then the Fields' south gate, and Oak Village. Behind you is a landscape that was defended in Parliament seven times, bought twice by public subscription, quarried for sand, dammed for drinking water, painted by Constable, walked by Keats, guarded by the copyholders who would not let their lord enclose it, and finally passed, after the Metropolitan Board of Works, the LCC and the GLC, to the City of London Corporation, which has run it since 1989. Sheep came back in 2019 and again in 2023. They were not consulted.</p> <p class=\"last\">The oak the whole district is named after is still missing. You have just walked nine and a half kilometres round what it stood for.</p>", "img": [{"src": "s20-lido.jpg", "alt": "Parliament Hill Lido, the pool and its brick surround", "caption": "Parliament Hill Lido, 1938. Unheated.", "credit": "Photo: Tom Page from London, UK, CC BY-SA 2.0", "w": 1100, "h": 825}], "lat": 51.55561, "lon": -0.15796, "detour": false}];
