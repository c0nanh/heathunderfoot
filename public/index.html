    title:f.name
  }).addTo(map);
  m.bindPopup('<div class="pop"><p class="pt">'+esc(f.name)+'</p><p class="pb">'+esc(f.blurb)+'</p>'+
    '<p class="pmore"><button type="button" data-open="stop" data-i="'+f.stop+'">Read stop '+f.stop+'</button></p></div>');
  featMarkers[f.id]=m;
});
map.on('popupopen',function(e){
  var b=e.popup.getElement().querySelector('[data-open]');
  if(b) b.addEventListener('click',function(){ map.closePopup(); openStop(parseInt(b.dataset.i,10)); });
});
$('legendToggle').addEventListener('click',function(){ $('legend').classList.toggle('closed'); });
if(window.innerWidth<500) $('legend').classList.add('closed');

/* ---------- geolocation ---------- */
function fmt(m){
  if(m==null) return '';
  return m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(m<10000?2:1)+' km';
}
function haversine(a,b,c,d){
  var R=6371000,p=Math.PI/180;
  var dla=(c-a)*p, dlo=(d-b)*p;
  var x=Math.sin(dla/2)*Math.sin(dla/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dlo/2)*Math.sin(dlo/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function bearingWord(a,b,c,d){
  var p=Math.PI/180,y=Math.sin((d-b)*p)*Math.cos(c*p);
  var x=Math.cos(a*p)*Math.sin(c*p)-Math.sin(a*p)*Math.cos(c*p)*Math.cos((d-b)*p);
  var deg=(Math.atan2(y,x)/p+360)%360;
  return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];
}
function toast(msg,ms){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');}, ms||3200);
}
function nearest(lat,lon){
  var best=null;
  STOPS.forEach(function(s){
    var d=haversine(lat,lon,s.lat,s.lon);
    if(!best||d<best.d) best={d:d,s:s};
  });
  return best;
}
function onFix(pos){
  var la=pos.coords.latitude, lo=pos.coords.longitude, acc=pos.coords.accuracy;
  lastFix={lat:la,lon:lo,acc:acc};
  if(!meMarker){
    meMarker=L.marker([la,lo],{icon:L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],
      html:'<div class="me"></div>'}),zIndexOffset:1000,interactive:false}).addTo(map);
    meCircle=L.circle([la,lo],{radius:acc,color:'#1268C3',weight:1,fillColor:'#1268C3',
      fillOpacity:.13,interactive:false}).addTo(map);
  }else{
    meMarker.getElement().querySelector('.me').classList.remove('stale');
    meMarker.setLatLng([la,lo]); meCircle.setLatLng([la,lo]); meCircle.setRadius(acc);
  }
  var n=nearest(la,lo);
  $('statusLead').innerHTML='Nearest: <b>'+n.s.n+'</b> '+esc(n.s.title)+' · '+
      fmt(n.d)+' '+bearingWord(la,lo,n.s.lat,n.s.lon);
  $('statusAcc').textContent='±'+Math.round(acc)+' m';
  document.querySelectorAll('.pin.near').forEach(function(el){el.classList.remove('near');});
  var pe=document.querySelector('.pin[data-n="'+n.s.n+'"]');
  if(pe && n.d<160) pe.classList.add('near');
  if(following) map.panTo([la,lo],{animate:true});
  if(listOpen) renderList();
  if(mode==='stop'&&current) renderStats(stopByN(current));
}
function onFixError(err){
  var msg='Location unavailable';
  if(err.code===1) msg='Location permission denied — allow it in Settings › Safari';
  else if(err.code===2) msg='No position fix yet — try again outdoors';
  else if(err.code===3) msg='Location timed out';
  $('statusLead').textContent=msg;
  toast(msg,5000);
  stopWatch();
}
function startWatch(){
  if(!navigator.geolocation){ toast('This browser has no geolocation',4000); return; }
  if(!window.isSecureContext){
    toast('Location needs an https:// address — see the README',6000);
  }
  watchId=navigator.geolocation.watchPosition(onFix,onFixError,
    {enableHighAccuracy:true,maximumAge:4000,timeout:20000});
  following=true;
  $('btnLoc').classList.add('on'); $('btnLoc').setAttribute('aria-pressed','true');
  $('btnLoc').textContent='Tracking';
  $('statusLead').textContent='Waiting for a fix…';
}
function stopWatch(){
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  watchId=null; following=false;
  $('btnLoc').classList.remove('on'); $('btnLoc').setAttribute('aria-pressed','false');
  $('btnLoc').textContent='Locate';
  $('statusAcc').textContent='';
  if(meMarker) meMarker.getElement().querySelector('.me').classList.add('stale');
}
$('btnLoc').addEventListener('click',function(){
  if(watchId==null){ startWatch(); }
  else if(!following && lastFix){ following=true; map.panTo([lastFix.lat,lastFix.lon]); $('btnLoc').classList.add('on'); $('btnLoc').textContent='Tracking'; }
  else { stopWatch(); }
});
map.on('dragstart',function(){
  if(following){ following=false; $('btnLoc').classList.remove('on'); $('btnLoc').textContent='Recentre'; }
});

/* ---------- sheet ---------- */
var listOpen=false;
function openSheet(){ $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false');
  $('scrim').classList.add('open'); }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true');
  $('scrim').classList.remove('open'); listOpen=false; }
$('sheetClose').addEventListener('click',closeSheet);
$('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

function stopByN(n){ for(var i=0;i<STOPS.length;i++) if(STOPS[i].n===n) return STOPS[i]; return null; }
function pad(n){ return (n<10?'0':'')+n; }

/* elevation profile: all twenty stops, current one highlighted */
function profileSVG(cur){
  var W=Math.max(200,($('sheetBody').clientWidth||320)-36), H=46, padX=6, top=8, bot=8;
  var kms=STOPS.map(function(s){return s.km;}), els=STOPS.map(function(s){return s.ele;});
  var minE=Math.min.apply(null,els)-6, maxE=Math.max.apply(null,els)+4;
  function X(k){ return padX+(k/TOTAL_KM)*(W-2*padX); }
  function Y(e){ return top+(1-(e-minE)/(maxE-minE))*(H-top-bot); }
  var pts=STOPS.map(function(s){ return [X(s.km),Y(s.ele)]; });
  pts.push([X(TOTAL_KM),Y(STOPS[0].ele)]);
  var d=pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var area=d+' L'+X(TOTAL_KM).toFixed(1)+' '+H+' L'+X(0).toFixed(1)+' '+H+' Z';
  var dots=STOPS.map(function(s,i){
    var p=pts[i]; var isCur=s.n===cur;
    return '<circle class="'+(isCur?'dot':'pt')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(isCur?4.5:2)+'"/>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true">'+
    '<path class="area" d="'+area+'"/><path class="ln" d="'+d+'"/>'+dots+'</svg>';
}
function renderStats(s){
  var el=$('stats'); if(!el) return;
  var nx=stopByN(s.n+1);
  var nextD = nx ? Math.round((nx.km-s.km)*1000) : Math.round((TOTAL_KM-s.km)*1000);
  var you = lastFix ? fmt(haversine(lastFix.lat,lastFix.lon,s.lat,s.lon)) : null;
  el.innerHTML=
    '<div><b>'+s.km.toFixed(1)+' km</b><span>from the start</span></div>'+
    '<div><b>'+s.ele+' m</b><span>above sea level</span></div>'+
    (you ? '<div><b>'+you+'</b><span>from you</span></div>'
         : '<div><b>'+(nextD<1000?nextD+' m':(nextD/1000).toFixed(1)+' km')+'</b><span>'+(nx?'to stop '+nx.n:'to the end')+'</span></div>');
}
function figHTML(im,cls){
  return '<figure class="'+cls+'"><img src="img/'+im.src+'" alt="'+esc(im.alt||'')+'" width="'+(im.w||1200)+'" height="'+(im.h||800)+'" loading="lazy" decoding="async">'+
    '<figcaption>'+esc(im.caption||'')+(im.credit?' <span>'+esc(im.credit)+'</span>':'')+'</figcaption></figure>';
}
function openStop(n){
  var s=stopByN(n); if(!s) return;
  current=n; mode='stop'; listOpen=false;
  var h=hero(s);
  var html=(h?figHTML(h,'hero'):'')+
    '<div class="sheet-head"><div class="num">'+pad(n)+'</div><div class="sheet-title">'+
    '<span class="k">Stop '+n+' of 20</span><h2>'+esc(s.title)+'</h2>'+
    (s.where?'<p class="w">'+esc(s.where)+'</p>':'')+'</div></div>'+
    '<div class="stats" id="stats"></div>'+
    '<div class="profile">'+profileSVG(n)+'</div>'+
    '<div class="text">'+s.html+'</div>';
  $('sheetBody').innerHTML=html;
  renderStats(s);
  $('sheetBody').scrollTop=0;
  $('sheetNav').style.display='';
  $('navPrev').disabled=(n<=1); $('navNext').disabled=(n>=20);
  openSheet();
}
$('navPrev').addEventListener('click',function(){ if(current>1) openStop(current-1); });
$('navNext').addEventListener('click',function(){ if(current<20) openStop(current+1); });
$('navShow').addEventListener('click',function(){
  var s=stopByN(current); if(!s) return;
  closeSheet();
  map.setView([s.lat,s.lon], Math.max(map.getZoom(),16), {animate:true});
  setTimeout(function(){ stopMarkers[s.n].openPopup(); },320);
});

function renderList(){
  var rows=STOPS.map(function(s){
    var d=lastFix?haversine(lastFix.lat,lastFix.lon,s.lat,s.lon):null;
    return {s:s,d:d};
  });
  var minD=null;
  rows.forEach(function(r){ if(r.d!=null&&(minD==null||r.d<minD)) minD=r.d; });
  $('sheetBody').innerHTML=
    '<div class="sheet-head"><div class="sheet-title"><span class="k">'+
    (lastFix?'Route order · distance from you':'The twenty stops, in route order')+
    '</span><h2>Stops</h2></div></div>'+
    '<div class="list">'+rows.map(function(r){
    var h=hero(r.s);
    return '<button type="button" data-goto="'+r.s.n+'">'+
      '<span class="th'+(h?'':' noimg')+'"'+(h?' style="background-image:url(img/'+h.src+')"':'')+'><span class="n">'+r.s.n+'</span></span>'+
      '<span class="nm">'+esc(r.s.title)+'<small>'+r.s.km.toFixed(1)+' km · '+r.s.ele+' m</small></span>'+
      '<span class="d'+(r.d!=null&&r.d===minD?' near':'')+'">'+
        (r.d!=null?fmt(r.d):'')+'</span></button>';
  }).join('')+'</div>';
  $('sheetBody').querySelectorAll('[data-goto]').forEach(function(b){
    b.addEventListener('click',function(){ openStop(parseInt(b.dataset.goto,10)); });
  });
}
$('btnList').addEventListener('click',function(){
  if(listOpen){ closeSheet(); return; }
  listOpen=true; mode='list';
  $('sheetNav').style.display='none';
  renderList();
  $('sheetBody').scrollTop=0;
  openSheet();
});

/* ---------- intro ---------- */
function ribbonSVG(){
  var W=320,H=200,pad=14;
  var lats=ROUTE.map(function(p){return p[0];}), lons=ROUTE.map(function(p){return p[1];});
  var minLa=Math.min.apply(null,lats),maxLa=Math.max.apply(null,lats),minLo=Math.min.apply(null,lons),maxLo=Math.max.apply(null,lons);
  var k=Math.cos(51.565*Math.PI/180);
  var sx=(W-2*pad)/((maxLo-minLo)*k), sy=(H-2*pad)/(maxLa-minLa), sc=Math.min(sx,sy);
  var ox=(W-(maxLo-minLo)*k*sc)/2, oy=(H-(maxLa-minLa)*sc)/2;
  function X(lo){return ox+(lo-minLo)*k*sc;} function Y(la){return oy+(maxLa-la)*sc;}
  var d=ROUTE.map(function(p,i){return (i?'L':'M')+X(p[1]).toFixed(1)+' '+Y(p[0]).toFixed(1);}).join('');
  var dots=STOPS.map(function(s){
    return '<circle class="rc'+(s.detour?' det':'')+'" cx="'+X(s.lon).toFixed(1)+'" cy="'+Y(s.lat).toFixed(1)+'" r="7"/>'+
      '<text class="rn" x="'+X(s.lon).toFixed(1)+'" y="'+(Y(s.lat)+3).toFixed(1)+'" text-anchor="middle">'+s.n+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path class="rl" d="'+d+'"/>'+dots+'</svg>';
}
function openIntro(){
  mode='intro'; listOpen=false;
  var t=$('introTpl').content.cloneNode(true);
  $('sheetBody').innerHTML='';
  $('sheetBody').appendChild(t);
  $('ribbon').innerHTML=ribbonSVG();
  var cr=$('credits');
  cr.innerHTML=CREDITS.map(function(c){ return '<li>'+c+'</li>'; }).join('');
  $('sheetNav').style.display='none';
  $('sheetBody').scrollTop=0;
  openSheet();
}
$('btnAbout').addEventListener('click',function(){ if(mode==='intro'&&$('sheet').classList.contains('open')) closeSheet(); else openIntro(); });
(function(){
  var seen=false;
  try{ seen=localStorage.getItem('heath-intro')==='1'; }catch(e){}
  if(!seen){
    setTimeout(openIntro,600);
    try{ localStorage.setItem('heath-intro','1'); }catch(e){}
  }
})();

/* ---------- offline tiles ---------- */
var BBOX={n:51.5755,s:51.5520,w:-0.1905,e:-0.1470}, ZOOMS=[14,15,16,17];
function tileList(){
  var out=[];
  ZOOMS.forEach(function(z){
    var n=Math.pow(2,z);
    function xt(lon){ return Math.floor((lon+180)/360*n); }
    function yt(lat){ var r=lat*Math.PI/180;
      return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n); }
    for(var x=xt(BBOX.w);x<=xt(BBOX.e);x++)
      for(var y=yt(BBOX.n);y<=yt(BBOX.s);y++)
        out.push('https://a.tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png');
  });
  return out;
}
$('btnSave').addEventListener('click',function(){
  if(!('caches' in window)){ toast('This browser cannot store the map offline',4000); return; }
  var urls=tileList(), done=0, fail=0, i=0, btn=$('btnSave');
  btn.disabled=true;
  toast('Saving '+urls.length+' map tiles for offline use…',4000);
  caches.open('heath-tiles-v1').then(function(cache){
    function next(){
      if(i>=urls.length){
        if(--active===0){
          btn.disabled=false; btn.textContent='Saved';
          toast('Map saved — '+done+' tiles'+(fail?', '+fail+' failed':'')+'. Works without signal now.',6000);
        }
        return;
      }
      var u=urls[i++];
      cache.match(u).then(function(hit){
        if(hit){ done++; tick(); return next(); }
        return fetch(u,{mode:'cors'}).then(function(r){
          if(r.ok) return cache.put(u,r.clone()).then(function(){done++;});
          fail++;
        }).catch(function(){ fail++; }).then(function(){ tick(); next(); });
      });
    }
    function tick(){ btn.textContent=Math.round((done+fail)/urls.length*100)+'%'; }
    var active=4;
    for(var k=0;k<4;k++) next();
  });
});

/* ---------- offline ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
  var refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(refreshing) return;
    refreshing=true;
    toast('Updated — reloading',1500);
    setTimeout(function(){ location.reload(); },900);
  });
}
})();
